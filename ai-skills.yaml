sources:
  - path: https://github.com/InsonusK/ai-skills.git
    type: github
    tree: master
    subpath:
      - skills/common-workflow/architecture/core
      - skills/common-workflow/develop
      - skills/common-workflow/documentation
      - skills/design
      - skills/devops
      - skills/devops/core
      - skills/devops/go
      - skills/testing/core
      - skills/testing/go
      - skills/go/architecture/plateau/plateau-http-service
      
target:
  default:
    path: .agents/skills
  claude:
    path: .claude/skills
    adapters:
      - claude-property-adapter

settings:
  remove_orphans: true
  dry_run: false
  add_relations: true